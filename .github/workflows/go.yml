name: Go

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Verify dependencies
        run: go mod verify

      - name: Build
        run: go build -v ./...

      # тесты в tests/ ходят на localhost:7540, без сервера они падают
      - name: Run tests
        run: |
          go run main.go &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:7540/ >/dev/null; then
              break
            fi
            sleep 1
          done
          go test -v ./tests
